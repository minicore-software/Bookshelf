<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Fundo Bege Acolhedor -->
    <linearGradient id="iconBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7EE" />
      <stop offset="100%" stop-color="#ECE3D0" />
    </linearGradient>

    <!-- Gradiente do Livro Central (Bege Ouro / Papel) -->
    <linearGradient id="centerBookGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2BA91" />
      <stop offset="35%" stop-color="#DFCB9F" />
      <stop offset="100%" stop-color="#C2A87D" />
    </linearGradient>

    <!-- Gradiente do Livro Verde (Esquerda) -->
    <linearGradient id="darkGreenBook" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#193529" />
      <stop offset="30%" stop-color="#244738" />
      <stop offset="100%" stop-color="#152D23" />
    </linearGradient>

    <!-- Gradiente do Livro Terracota (Direita) -->
    <linearGradient id="terracottaBook" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C85A32" />
      <stop offset="30%" stop-color="#DB6A41" />
      <stop offset="100%" stop-color="#9E4120" />
    </linearGradient>

    <!-- Gradiente da Prateleira (Terracota) -->
    <linearGradient id="shelfGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D26947" />
      <stop offset="100%" stop-color="#A94829" />
    </linearGradient>

    <!-- Sombra Projetada Suave dos Livros -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#3D2E1E" flood-opacity="0.18" />
    </filter>

    <!-- Sombra da Prateleira -->
    <filter id="shelfShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#2A1B0E" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- 1. FUNDO COM CANTOS ARREDONDADOS (Formatado para Ícone Android / Play Store) -->
  <rect width="512" height="512" rx="108" fill="url(#iconBgGradient)" />

  <!-- 2. ELEMENTOS AMPLIADOS EM 25% (Transformação aplicada com ponto de pivô central 256, 256) -->
  <g transform="translate(256, 256) scale(1.25) translate(-256, -256)">
    
    <!-- PRATELEIRA DE TERRACOTA -->
    <rect x="100" y="348" width="312" height="22" rx="6" fill="url(#shelfGradient)" filter="url(#shelfShadow)" />

    <!-- GRUPO DOS LIVROS -->
    <g filter="url(#iconShadow)">
      
      <!-- LIVRO 1 (Esquerda - Verde Escuro Floresta) -->
      <g transform="translate(142, 160)">
        <rect x="0" y="0" width="52" height="188" rx="14" fill="url(#darkGreenBook)" />
        <!-- Dobra da Lombada -->
        <rect x="22" y="0" width="8" height="188" fill="#0D1E17" opacity="0.18" />
        <!-- Detalhe Dourado (Losango) -->
        <polygon points="26,88 33,95 26,102 19,95" fill="#D4AF37" />
      </g>

      <!-- LIVRO 2 (Centro - Bege Dourado Alto) -->
      <g transform="translate(230, 140)">
        <rect x="0" y="0" width="52" height="208" rx="14" fill="url(#centerBookGradient)" />
        <!-- Dobra da Lombada -->
        <rect x="22" y="0" width="8" height="208" fill="#806236" opacity="0.15" />
      </g>

      <!-- LIVRO 3 (Direita - Terracota) -->
      <g transform="translate(318, 160)">
        <rect x="0" y="0" width="52" height="188" rx="14" fill="url(#terracottaBook)" />
        <!-- Dobra da Lombada -->
        <rect x="22" y="0" width="8" height="188" fill="#5E220D" opacity="0.18" />
        <!-- Detalhe Dourado (Losango) -->
        <polygon points="26,88 33,95 26,102 19,95" fill="#E5C158" />
      </g>

    </g>
  </g>
</svg>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookshelf — Discover &amp; Add</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F3EEE3;}
  a{color:inherit;text-decoration:none;}
  .nav-link:hover{opacity:0.75;}
  .scan-btn:hover{background:#26382E;}
  .result:hover{background:#F6F2E8;}
</style>
</helmet>

<div style="width:390px;height:844px;box-sizing:border-box;background:#F3EEE3;display:flex;flex-direction:column;overflow:hidden;position:relative;color:#231F20;">

  <!-- Header -->
  <div style="padding:28px 20px 14px 20px;display:flex;flex-direction:column;gap:14px;">
    <span style="font-family:'Fraunces',serif;font-weight:600;font-size:24px;">Add a book</span>
    <div style="display:flex;align-items:center;gap:10px;background:#FBF8F1;border:1px solid #E3DCC9;border-radius:14px;padding:11px 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8274" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Title, author, or ISBN" style="flex:1;border:none;background:transparent;outline:none;font-size:14px;color:#231F20;font-family:'Inter',sans-serif;">
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:4px 20px 24px 20px;display:flex;flex-direction:column;gap:22px;">

    <!-- Scan card -->
    <div style="background:#2F4538;border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;">
      <div style="width:100%;height:120px;border-radius:12px;background:rgba(243,238,227,0.08);border:1.5px dashed rgba(243,238,227,0.4);display:flex;align-items:center;justify-content:center;position:relative;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F3EEE3" stroke-width="1.6" aria-hidden="true">
          <rect x="3" y="7" width="1.4" height="10"/><rect x="5.8" y="7" width="0.8" height="10"/><rect x="7.6" y="7" width="2" height="10"/><rect x="10.8" y="7" width="0.8" height="10"/><rect x="12.4" y="7" width="1.4" height="10"/><rect x="15" y="7" width="2" height="10"/><rect x="18.2" y="7" width="0.8" height="10"/><rect x="20" y="7" width="1" height="10"/>
        </svg>
        <span style="position:absolute;top:8px;left:8px;width:16px;height:16px;border-top:2px solid #C9A227;border-left:2px solid #C9A227;"></span>
        <span style="position:absolute;top:8px;right:8px;width:16px;height:16px;border-top:2px solid #C9A227;border-right:2px solid #C9A227;"></span>
        <span style="position:absolute;bottom:8px;left:8px;width:16px;height:16px;border-bottom:2px solid #C9A227;border-left:2px solid #C9A227;"></span>
        <span style="position:absolute;bottom:8px;right:8px;width:16px;height:16px;border-bottom:2px solid #C9A227;border-right:2px solid #C9A227;"></span>
      </div>
      <button class="scan-btn" style="width:100%;background:#F3EEE3;color:#2F4538;border:none;border-radius:11px;padding:12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:background 0.15s;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2F4538" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Scan barcode
      </button>
      <span style="font-size:12px;color:#CBD3C6;">Point your camera at the ISBN barcode</span>
    </div>

    <!-- Recent searches -->
    <div style="display:flex;flex-direction:column;gap:10px;">
      <span style="font-size:13px;font-weight:600;color:#8A8274;text-transform:uppercase;letter-spacing:0.04em;">Recent searches</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <span style="font-size:13px;color:#4A4640;background:#FBF8F1;border:1px solid #E3DCC9;padding:7px 14px;border-radius:16px;">Tomorrow, and Tomorrow</span>
        <span style="font-size:13px;color:#4A4640;background:#FBF8F1;border:1px solid #E3DCC9;padding:7px 14px;border-radius:16px;">Yuval Noah Harari</span>
      </div>
    </div>

    <!-- Search results -->
    <div style="display:flex;flex-direction:column;gap:10px;">
      <span style="font-size:13px;font-weight:600;color:#8A8274;text-transform:uppercase;letter-spacing:0.04em;">Results for "wohlleben"</span>

      <div class="result" style="display:flex;gap:12px;padding:10px;border-radius:12px;">
        <div style="width:48px;height:70px;border-radius:5px;background:#355A51;flex-shrink:0;"></div>
        <div style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;">
          <span style="font-size:14px;font-weight:600;line-height:1.3;">The Hidden Life of Trees</span>
          <span style="font-size:12.5px;color:#8A8274;">Peter Wohlleben · 2015</span>
        </div>
        <button aria-label="Add The Hidden Life of Trees to library" style="width:34px;height:34px;border-radius:50%;background:#EDE5D3;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F4538" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>

      <div class="result" style="display:flex;gap:12px;padding:10px;border-radius:12px;">
        <div style="width:48px;height:70px;border-radius:5px;background:#7A8559;flex-shrink:0;"></div>
        <div style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;">
          <span style="font-size:14px;font-weight:600;line-height:1.3;">The Secret Wisdom of Nature</span>
          <span style="font-size:12.5px;color:#8A8274;">Peter Wohlleben · 2019</span>
        </div>
        <button aria-label="Add The Secret Wisdom of Nature to library" style="width:34px;height:34px;border-radius:50%;background:#EDE5D3;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F4538" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>

      <a href="#" style="font-size:13px;color:#2F4538;font-weight:600;padding:4px 10px;">Can't find it? Add manually</a>
    </div>
  </div>

  <!-- Bottom nav -->
  <div style="flex-shrink:0;background:#FBF8F1;border-top:1px solid #E3DCC9;display:flex;align-items:center;justify-content:space-around;padding:12px 0 18px 0;">
    <a href="Main.dc.html" class="nav-link" aria-label="Library" style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9B9382" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20V6a2 2 0 0 1 2-2h4v16"/><path d="M9 20V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v14"/><path d="M15 20V8a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v12"/></svg>
      <span style="font-size:11px;color:#9B9382;">Library</span>
    </a>
    <a href="AddBook.dc.html" class="nav-link" aria-label="Discover" style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F4538" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span style="font-size:11px;color:#2F4538;font-weight:600;">Discover</span>
    </a>
    <a href="Stats.dc.html" class="nav-link" aria-label="Stats" style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9B9382" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="20" x2="5" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="19" y1="20" x2="19" y2="15"/></svg>
      <span style="font-size:11px;color:#9B9382;">Stats</span>
    </a>
    <a href="Settings.dc.html" class="nav-link" aria-label="Settings" style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9B9382" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span style="font-size:11px;color:#9B9382;">Settings</span>
    </a>
  </div>

</div>
</x-dc>

</html>
